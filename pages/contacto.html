    <main class="pagina-contacto py-5">
        <div class="container">
            <h1 class="text-center mb-5">Cuéntanos sobre tu negocio</h1>

            <div class="row g-4 justify-content-center">
                <div class="col-lg-8">
                    <section class="seccion-formulario card border-0 shadow-sm p-3 p-md-4">
                        <form action="#" method="post" class="row g-3">
                            <div class="col-12 form-floating">
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Luis García Solis" required>
                                <label for="nombre">Nombre</label>
                            </div>
                            <div class="col-12 form-floating">
                                <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@gmail.com" required>
                                <label for="email">Correo electrónico</label>
                            </div>
                            <div class="col-12 form-floating">
                                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="+506 8888 0000" required>
                                <label for="telefono">Teléfono</label>
                            </div>
                            <div class="col-12 form-floating">
                                <textarea class="form-control" id="dedicacion" name="dedicacion" placeholder="Ej. Clínica dental, tienda de ropa, restaurante..." style="height: 100px" required></textarea>
                                <label for="dedicacion">¿A qué se dedica su negocio?</label>
                            </div>
                            <div class="col-12 form-floating">
                                <textarea class="form-control" id="inspiracion" name="inspiracion" placeholder="Ej. Cuéntenos referencias, estilos o perfiles que le gustaría reflejar" style="height: 100px" required></textarea>
                                <label for="inspiracion">¿Inspiración de lo que aspira en su perfil?</label>
                            </div>
                            <div class="col-12 form-floating">
                                <textarea class="form-control" id="mensaje" name="mensaje" placeholder="Cuéntenos un poco más sobre lo que busca" style="height: 100px"></textarea>
                                <label for="mensaje">Mensaje</label>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary px-4 py-2">Enviar mensaje</button>
                            </div>
                        </form>
                    </section>
                </div>

                <div class="col-lg-4 d-none d-lg-block">

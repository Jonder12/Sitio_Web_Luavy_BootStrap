    <main class="pagina-contacto">
        <h1>Cuéntanos sobre tu negocio</h1>
        <div class="contenedor-contacto">
            <section class="seccion-formulario">
                <form action="#" method="post" class="form-contacto">
                    <div class="campo flotante">
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Luis García Solis" required />
                        <label for="nombre">Nombre</label>
                    </div>
                    <div class="campo flotante">
                        <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required />
                        <label for="email">Correo electrónico</label>
                    </div>
                    <div class="campo flotante">
                        <input type="tel" id="telefono" name="telefono" placeholder="+506 8888 0000" required />
                        <label for="telefono">Teléfono</label>
                    </div>
                    <div class="campo flotante">
                        <textarea id="dedicacion" name="dedicacion" placeholder="Ej. Clínica dental, tienda de ropa, restaurante..." required></textarea>
                        <label for="dedicacion">¿A qué se dedica su negocio?</label>
                    </div>
                    <div class="campo flotante">
                        <textarea id="inspiracion" name="inspiracion" placeholder="Ej. Cuéntenos referencias, estilos o perfiles que le gustaría reflejar" required></textarea>
                        <label for="inspiracion">¿Inspiración de lo que aspira en su perfil?</label>
                    </div>
                    <div class="campo flotante">
                        <textarea id="mensaje" name="mensaje" placeholder="Cuéntenos un poco más sobre lo que busca"></textarea>
                        <label for="mensaje">Mensaje</label>
                    </div>
                    <button type="submit">Enviar mensaje</button>
                </form>
            </section>
            <aside class="info-contacto">
                <h3>Información de contacto</h3>
                <div class="dato-contacto">
                    <a href="https://wa.me/50671424874">
                        <img src="../img/iconos/redes/whatsapp.png" alt="Logo de WhatsApp" width="40" height="40">
                        <span>WhatsApp</span>
                    </a>
                </div>
                <div class="dato-contacto">
                    <a href="https://www.instagram.com/luavycr?igsh=MXdvM2ttZTNzbWc0">
                        <img src="../img/iconos/redes/instagram.png" alt="Logo de Instagram" width="40" height="40">
                        <span>@luavycr</span>

                    <a href="https://www.facebook.com/share/1bbfkhf3eX/">
                        <img src="../img/iconos/redes/facebook.png" alt="Logo de Facebook" width="40" height="40">
